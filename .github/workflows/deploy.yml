# Tests, builds and publishes the app to GitHub Pages (https://csabattilas.github.io/dutch-trainer/)
# on every push to main. Can also be started by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older run still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dutch-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Angular CLI 22 needs Node >= 22.22.3 or >= 24.15.
          node-version: 24
          cache: npm
          cache-dependency-path: dutch-app/package-lock.json

      - run: npm ci

      - name: Test the app
        run: npx ng test --watch=false

      - name: Test the data tools
        working-directory: tools
        run: npm test

      # The app is served from /dutch-trainer/, not the domain root.
      - name: Build
        run: npx ng build --base-href /dutch-trainer/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dutch-app/dist/dutch-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
